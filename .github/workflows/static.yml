
name: Deploy Chowdeck to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Chowdeck project
        run: |
          mkdir site
          unzip -q Chowdeck-NextJS-GitHub-Pages-FIX.zip -d site

      - name: Install dependencies
        working-directory: site
        run: npm install

      - name: Build website
        working-directory: site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        
